<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sofa</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #636c76;
        --border: #d0d7de;
        --accent: #0969da;
        --danger: #cf222e;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #f0f6fc;
          --muted: #9198a1;
          --border: #3d444d;
          --accent: #4493f8;
          --danger: #f85149;
        }
      }

      body {
        width: 320px;
        margin: 0;
        padding: 12px;
        background: var(--bg);
        color: var(--fg);
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      }

      h1 {
        margin: 0 0 2px;
        font-size: 14px;
      }

      p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      form {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }

      input {
        flex: 1 1 auto;
        min-width: 0;
        padding: 5px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
      }

      button {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        padding: 5px 10px;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      li {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-top: 1px solid var(--border);
      }

      .host {
        flex: 1 1 auto;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }

      .remove:hover {
        border-color: var(--danger);
        color: var(--danger);
      }

      .empty,
      .error {
        color: var(--muted);
        font-size: 12px;
        padding: 6px 0;
      }

      .error {
        color: var(--danger);
      }
    </style>
  </head>
  <body>
    <h1>Sofa</h1>
    <p>
      Works on github.com out of the box. Add a GitHub Enterprise host to review
      pull requests there too.
    </p>
    <form id="add-form">
      <input id="host-input" type="text" placeholder="github.mycompany.com" aria-label="Enterprise host" />
      <button type="submit">Add</button>
    </form>
    <div id="error" class="error" hidden></div>
    <ul id="host-list"></ul>
    <script src="popup.js"></script>
  </body>
</html>
